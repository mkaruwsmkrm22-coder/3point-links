<title>3POINT | Official Links</title>
<style>
:root{--bg:#080808;--gold:#c8a45d;--gold2:#f0d99b;--white:#f7f5ef;--muted:#aaa49a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -10%,#292116 0%,#111 34%,var(--bg) 72%);color:var(--white);font-family:Arial,Helvetica,sans-serif;padding:28px 17px 38px;display:flex;justify-content:center}
main{width:min(100%,460px);display:flex;flex-direction:column;align-items:center}
.frame{width:100%;padding:1px;border:1px solid rgba(200,164,93,.72);border-radius:17px;background:linear-gradient(135deg,rgba(240,217,155,.35),rgba(200,164,93,.04) 45%,rgba(240,217,155,.22));box-shadow:0 16px 55px rgba(0,0,0,.55)}
.wordmark{display:block;width:100%;border-radius:16px;overflow:hidden;background:#000}
.wordmark img{display:block;width:100%;height:auto}
.eyebrow{font-size:10px;letter-spacing:.32em;color:var(--gold2);font-weight:700;margin:22px 0 18px;text-align:center}
.tagline{font-size:12px;color:var(--muted);letter-spacing:.08em;text-align:center;margin:0 0 23px}
.links{width:100%;display:grid;gap:12px}
.link{min-height:62px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(200,164,93,.48);border-radius:13px;background:linear-gradient(110deg,#1b1915,#101010 65%,#17130d);color:#fff;text-decoration:none;font-weight:700;letter-spacing:.12em;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 8px 20px rgba(0,0,0,.22);transition:.18s}
.link:hover{border-color:var(--gold2);transform:translateY(-2px)}
.left{display:flex;align-items:center;gap:14px}
.icon{width:36px;height:36px;flex:0 0 36px;border-radius:10px;display:grid;place-items:center;color:var(--gold2);border:1px solid rgba(200,164,93,.55);padding:6px}.icon svg{display:block;width:100%;height:100%;fill:currentColor}
.arrow{color:var(--gold2);font-size:21px}
.brand-card{margin-top:26px;width:164px;padding:10px;background:#f7f7f4;border:1px solid var(--gold);border-radius:13px;box-shadow:0 0 28px rgba(200,164,93,.12)}
.brand-card img{display:block;width:100%;height:auto}
.contact{width:100%;margin-top:22px;text-align:center;padding:18px 12px;border-top:1px solid rgba(200,164,93,.45);border-bottom:1px solid rgba(200,164,93,.25)}
.contact .label{font-size:10px;letter-spacing:.25em;color:var(--gold2);margin-bottom:9px}
.contact a{color:#fff;text-decoration:none;font-size:17px;font-weight:700;letter-spacing:.05em}
.footer{margin-top:21px;color:#82765e;font-size:9px;letter-spacing:.22em;text-align:center}
</style>
